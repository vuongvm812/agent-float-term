name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing maintainer-created tag (v0.1.0 or v0.1.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve existing tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and resolve tag
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 -B scripts/release_source.py resolve "$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* && "$PRERELEASE" != true ]]; then
            printf '%s\n' 'Prerelease version tags must be marked prerelease.' >&2
            exit 1
          fi

  verify:
    name: Verify tagged source
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  build:
    name: Package (${{ matrix.target }})
    needs: [resolve, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: 1.84.1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Install Rust 1.84.1
        run: rustup toolchain install 1.84.1 --profile minimal
      - name: Package native binary
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: '1' # Keep macOS AppleDouble metadata out of the tar layout.
        run: bash scripts/package-release.sh "$TAG" "$TARGET"
      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/agent-float-term-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact verified release source and formula template
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Download this run's archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify assets and create draft
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          TAG_OBJECT: ${{ needs.resolve.outputs.tag_object }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          archives=(
            "agent-float-term-$TAG-aarch64-apple-darwin.tar.gz"
            "agent-float-term-$TAG-x86_64-apple-darwin.tar.gz"
            "agent-float-term-$TAG-x86_64-unknown-linux-gnu.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          assets=("${archives[@]}" SHA256SUMS)
          if [[ "$PRERELEASE" == false ]]; then
            python3 -B ../scripts/generate-homebrew-formula.py "$TAG" SHA256SUMS --output agent-float-term.rb
            ruby -c agent-float-term.rb
            assets+=(agent-float-term.rb)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          # Check both the original tag object and its peeled commit immediately before upload.
          python3 -B ../scripts/release_source.py check "$TAG" "$COMMIT" "$TAG_OBJECT" "$GH_REPO"
          options=(--draft --verify-tag --target "$COMMIT" --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "${assets[@]}" "${options[@]}"
